
<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
    <style>
      html, body {
        height: 100%;
        padding: 0;
        margin: 0;
      }
      #map {
        /* configure the size of the map */
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // initialize Leaflet
      var map = L.map('map').setView({lon: 76.29168, lat: 9.99432}, 15);
      // add the OpenStreetMap tiles
      L.tileLayer('http://localhost/tiles/{z}/{x}/{y}.png', {
        minZoom: 9,
        maxZoom: 15,
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
      }).addTo(map);
      let apiData;
      async function fetchJsonData(url) {
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          // The .json() method parses the JSON response into a JS object
          apiData = await response.json(); 
          var pointsForLineAndMarkers = [];
          //You can now use apiData within this async scope
          apiData.forEach(function(element){
            pointsForLineAndMarkers.push([element.lat, element.lng]);
          }); 
          // Add the polyline to the map
          var polyline = L.polyline(pointsForLineAndMarkers, {color: '#000000'}).addTo(map);
          // Zoom the map to fit the polyline's bounds
          map.fitBounds(polyline.getBounds());
        } catch (error) {
          console.error('There has been a problem with your fetch operation:', error);
        }
      }
      fetchJsonData('./R1_1.json');
    </script>
  </body>
</html>
